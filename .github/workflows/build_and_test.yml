name: Build and Test

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]

jobs:
    build_desktop:
        name: "Build and test"
        runs-on: ${{ matrix.os }}
        services:
            clamav:
                image: clamav/clamav:1.5.4-debian13-slim
                ports:
                    # Opens tcp port 3310 on the host and service container
                    - 3310:3310
        strategy:
            matrix:
                os: [ubuntu-latest]
                python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install dependencies
                run: pip install -e ".[test]"
            -   name: Test with pytest
                run: |
                    pytest tests --junitxml=junit/test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml --cov=aioclamd --cov-report=xml --cov-report=html
            -   name: Upload pytest test results
                uses: actions/upload-artifact@v4
                with:
                    name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
                    path: junit/test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
                # Use always() to always run this step to publish test results when there are test failures
                if: ${{ always() }}
